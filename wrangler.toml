name = "iptv-manager"
main = "worker/index.js"
compatibility_date = "2026-11-22"

[[d1_databases]]
binding = "DB"
database_name = "iptv"
database_id = "8d15503f-0328-42f5-9673-d946aec7f012"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PLAYLISTS"
bucket_name = "iptv-playlists"

[vars]
APP_API_URL = "https://iptv-manager.gastura.workers.dev/"
ENVIRONMENT = "production"
GITHUB_BRANCH = "main"
GITHUB_REPOSITORY = "gasturadbc/iptv"
GITHUB_WORKFLOW = "validate.yml"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/playlist.m3u"]
