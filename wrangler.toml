name = "iptv-manager"
main = "worker/index.js"
compatibility_date = "2026-11-22"

[[d1_databases]]
binding = "DB"
database_name = "iptv"
database_id = "8d15503f-0328-42f5-9673-d946aec7f012"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
GITHUB_WORKFLOW = "validate.yml"
GITHUB_BRANCH = "main"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/playlist.m3u"]
